[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sociofm"
version = "0.1.0"
description = "Compute-efficient foundation models for societal event streams"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "accelerate>=1.0",
  "matplotlib>=3.9",
  "numpy>=1.26",
  "pandas>=2.2",
  "safetensors>=0.4",
  "scikit-learn>=1.5",
  "torch>=2.8",
  "transformers>=5.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
